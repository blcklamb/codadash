<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101310" />
    <!-- seo:start -->
    <title>codadash (코다대시) | 코드 타자 연습 · 키보드 연습</title>
    <meta
      name="description"
      content="코다대시에서 11개 언어의 코드로 키보드 연습, 타자 연습, 타건 연습을 시작하세요. 타수와 정확도 측정, 일일 연습과 1대1 대전을 제공합니다."
    />
    <!-- seo:end -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        padding: 24px;
        color: #e3e8d6;
        background: #101310;
        font-family: 'JetBrains Mono', monospace;
        text-align: center;
      }
      .boot-screen__mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        color: #101310;
        background: #a8e66f;
        font-size: 20px;
        font-weight: 600;
      }
      .boot-screen__brand {
        font-size: 24px;
        font-weight: 600;
      }
      .boot-screen__message {
        color: #9ca894;
        font-size: 13px;
      }
      .boot-screen__dots {
        display: inline-block;
        width: 18px;
        overflow: hidden;
        vertical-align: bottom;
        animation: boot-dots 1.2s steps(4, end) infinite;
      }
      @keyframes boot-dots {
        from {
          width: 0;
        }
        to {
          width: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen__dots {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- intro:start -->
      <div class="boot-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-screen__mark" aria-hidden="true">&gt;_</div>
        <div class="boot-screen__brand">codadash</div>
        <div class="boot-screen__message">
          Loading workspace<span class="boot-screen__dots" aria-hidden="true">...</span>
        </div>
      </div>
      <!-- intro:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
